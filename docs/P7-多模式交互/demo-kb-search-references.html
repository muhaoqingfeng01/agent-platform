<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Platform — 知识库检索 Demo</title>
    <style>
        :root {
            --bg: #0f1117;
            --panel: #1a1d27;
            --border: #2a2d3a;
            --text: #e1e4eb;
            --text-secondary: #8b8fa3;
            --accent: #6c8cff;
            --accent-hover: #8ba3ff;
            --user-bubble: #1e3a5f;
            --assistant-bubble: #1a1d27;
            --thinking: #8b6f3a;
            --success: #3a8b5c;
            --error: #c44;
            --radius: 8px;
            --radius-sm: 6px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
        }

        /* ── 侧边栏（参考文档） ── */
        .sidebar {
            width: 320px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform .25s;
        }
        .sidebar.hidden { transform: translateX(-100%); width: 0; min-width: 0; }
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .sidebar-header h3 { font-size: 14px; font-weight: 600; }
        .sidebar-header .count { color: var(--text-secondary); font-size: 12px; }
        .sidebar-list { flex: 1; overflow-y: auto; padding: 8px; }
        .sidebar-list:empty::after {
            content: '暂无引用文档';
            display: block;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 40px 0;
        }

        .doc-card {
            background: #22252f;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .15s;
        }
        .doc-card:hover { border-color: var(--accent); }
        .doc-card .doc-icon { font-size: 20px; margin-bottom: 6px; }
        .doc-card .doc-name {
            font-size: 13px; font-weight: 500;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .doc-card .doc-meta {
            font-size: 11px; color: var(--text-secondary); margin-top: 4px;
        }
        .doc-card .doc-actions { display: flex; gap: 8px; margin-top: 10px; }
        .doc-card .doc-actions button {
            flex: 1;
            padding: 5px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all .15s;
        }
        .doc-card .doc-actions button:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* ── 主聊天区 ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px;
        }
        .chat-header select, .chat-header input {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 6px 10px;
            font-size: 13px;
            outline: none;
        }
        .chat-header select:focus, .chat-header input:focus { border-color: var(--accent); }
        .chat-header input { width: 180px; }
        .toggle-sidebar {
            margin-left: auto;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--panel);
            color: var(--text);
            cursor: pointer;
            font-size: 12px;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; }
        .msg.user { align-self: flex-end; background: var(--user-bubble); }
        .msg.assistant { align-self: flex-start; background: var(--assistant-bubble); border: 1px solid var(--border); }
        .msg.thinking {
            align-self: flex-start;
            color: var(--thinking);
            font-size: 13px;
            font-style: italic;
            padding: 4px 0;
            background: none;
            border: none;
        }
        .msg .role { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; }

        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex; gap: 10px;
        }
        .input-area textarea {
            flex: 1;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text);
            padding: 10px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
            height: 48px;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .input-area button {
            padding: 0 24px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s;
            white-space: nowrap;
        }
        .input-area button:hover { background: var(--accent-hover); }
        .input-area button:disabled { opacity: .5; cursor: not-allowed; }

        .status-bar {
            padding: 6px 20px;
            font-size: 11px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            display: flex; gap: 16px;
        }
        .status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
        .dot.idle { background: #555; }
        .dot.streaming { background: var(--accent); animation: pulse 1s infinite; }
        .dot.error { background: var(--error); }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    </style>
</head>
<body>

<!-- ═══════════ 侧边栏 — 参考文档 ═══════════ -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h3>📄 参考文档</h3>
        <span class="count" id="refCount">0 个文件</span>
    </div>
    <div class="sidebar-list" id="refList"></div>
</div>

<!-- ═══════════ 主聊天区 ═══════════ -->
<div class="main">
    <div class="chat-header">
        <label style="font-size:13px;color:var(--text-secondary)">模式:</label>
        <select id="modeSelect">
            <option value="">智能对话（默认）</option>
            <option value="KNOWLEDGE_SEARCH">知识库检索</option>
        </select>
        <input type="text" id="kbInput" placeholder="知识库 ID（可选）" style="display:none">
        <button class="toggle-sidebar" onclick="toggleSidebar()">☰ 参考文档</button>
    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-area">
        <textarea id="userInput" placeholder="输入你的问题..." rows="1"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
        <button id="sendBtn" onclick="send()">发送</button>
    </div>

    <div class="status-bar">
        <span><span class="dot idle" id="statusDot"></span><span id="statusText">就绪</span></span>
        <span id="convId">convId: —</span>
    </div>
</div>

<script>
    // ==================== 全局状态 ====================
    const CONVERSATION_ID = 'conv-demo-' + Date.now();
    document.getElementById('convId').textContent = 'convId: ' + CONVERSATION_ID;

    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const modeSelect = document.getElementById('modeSelect');
    const kbInput = document.getElementById('kbInput');
    const refList = document.getElementById('refList');
    const refCount = document.getElementById('refCount');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    let currentAssistantMsg = null;   // 当前正在流式渲染的助手消息 DOM
    let currentTokenCount = 0;
    let docReferences = [];           // 当前会话累积的文档引用

    // 知识库检索模式时显示 KB ID 输入框
    modeSelect.addEventListener('change', () => {
        kbInput.style.display = modeSelect.value === 'KNOWLEDGE_SEARCH' ? 'inline-block' : 'none';
    });

    // ==================== 发送消息 ====================
    function send() {
        const content = userInput.value.trim();
        if (!content) return;

        // 渲染用户消息
        appendMessage('user', content);
        userInput.value = '';
        sendBtn.disabled = true;
        setStatus('streaming', '流式接收中...');

        // 创建助手消息容器
        currentAssistantMsg = appendMessage('assistant', '');
        currentTokenCount = 0;

        // 发起 SSE 连接
        const mode = modeSelect.value || undefined;
        const knowledgeId = kbInput.value.trim() || undefined;

        fetch('/api/v1/conversations/messages/stream', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + getToken(),
            },
            body: JSON.stringify({
                conversationId: CONVERSATION_ID,
                content: content,
                mode: mode,
                knowledgeId: knowledgeId,
            }),
        }).then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return readSSEStream(response);
        }).catch(err => {
            setStatus('error', '连接失败: ' + err.message);
            currentAssistantMsg.textContent = '[错误] ' + err.message;
            currentAssistantMsg.classList.add('error');
            sendBtn.disabled = false;
        });
    }

    // ==================== SSE 流解析 ====================
    async function readSSEStream(response) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            buffer = lines.pop(); // 保留不完整的最后一行

            let eventType = 'message';
            let eventData = '';

            for (const line of lines) {
                if (line.startsWith('event: ')) {
                    eventType = line.slice(7).trim();
                } else if (line.startsWith('data: ')) {
                    eventData = line.slice(6);
                } else if (line === '') {
                    // 空行 = 事件结束
                    handleSSEEvent(eventType, eventData);
                    eventType = 'message';
                    eventData = '';
                }
            }
        }
    }

    // ==================== SSE 事件处理 ====================
    function handleSSEEvent(type, data) {
        switch (type) {
            case 'thinking':
                appendMessage('thinking', data);
                break;

            case 'references':
                // 🆕 知识库检索命中的文件引用
                try {
                    docReferences = JSON.parse(data);
                    renderReferences(docReferences);
                } catch (e) {
                    console.error('解析 references 失败:', e);
                }
                break;

            case 'token':
                // LLM 流式 token
                currentAssistantMsg.textContent += data;
                currentTokenCount++;
                chatArea.scrollTop = chatArea.scrollHeight;
                break;

            case 'done':
                // 流式完成
                try {
                    const doneData = JSON.parse(data);
                    currentTokenCount = doneData.tokens || currentTokenCount;
                } catch (e) {}
                setStatus('idle', `完成 · ${currentTokenCount} tokens · ${docReferences.length} 个引用文档`);
                sendBtn.disabled = false;
                break;

            case 'error':
                // 错误
                try {
                    const errData = JSON.parse(data);
                    currentAssistantMsg.textContent += '\n\n[错误] ' + errData.message;
                } catch (e) {
                    currentAssistantMsg.textContent += '\n\n[错误] ' + data;
                }
                setStatus('error', '出错了');
                sendBtn.disabled = false;
                break;

            case 'ping':
                // 心跳 — 静默忽略
                break;

            default:
                console.debug('[SSE] 未处理事件:', type, data);
        }
    }

    // ==================== 渲染参考文档侧栏 ====================
    function renderReferences(docs) {
        refList.innerHTML = '';
        refCount.textContent = docs.length + ' 个文件';

        docs.forEach(doc => {
            const icon = getFileIcon(doc.fileType, doc.filename);
            const sizeStr = formatFileSize(doc.fileSize);

            const card = document.createElement('div');
            card.className = 'doc-card';
            card.innerHTML = `
                <div class="doc-icon">${icon}</div>
                <div class="doc-name" title="${esc(doc.filename)}">${esc(doc.filename)}</div>
                <div class="doc-meta">${esc(doc.fileType || '未知类型')} · ${sizeStr}</div>
                <div class="doc-actions">
                    <button onclick="previewDoc('${esc(doc.previewUrl)}', '${esc(doc.fileType)}')">🔍 预览</button>
                    <button onclick="downloadDoc('${esc(doc.downloadUrl)}')">⬇ 下载</button>
                </div>
            `;
            refList.appendChild(card);
        });

        // 自动展开侧边栏
        document.getElementById('sidebar').classList.remove('hidden');
    }

    function previewDoc(url, fileType) {
        // 图片/PDF/文本 → 新窗口直接预览
        if (/image|pdf|text/.test(fileType || '')) {
            window.open(url, '_blank');
        } else {
            // Office 文档 → Microsoft Office Web Viewer
            const fullUrl = window.location.origin + url;
            window.open('https://view.officeapps.live.com/op/view.aspx?src=' + encodeURIComponent(fullUrl), '_blank');
        }
    }

    function downloadDoc(url) {
        window.open(url, '_blank');
    }

    // ==================== 工具函数 ====================
    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (role === 'user' || role === 'assistant') {
            const roleSpan = document.createElement('div');
            roleSpan.className = 'role';
            roleSpan.textContent = role === 'user' ? '你' : '助手';
            div.appendChild(roleSpan);
        }
        const content = document.createElement('div');
        content.textContent = text;
        div.appendChild(content);
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return content;
    }

    function setStatus(state, text) {
        statusDot.className = 'dot ' + state;
        statusText.textContent = text;
    }

    function getToken() {
        // 从 URL hash 或 localStorage 读取 Token
        const hash = window.location.hash.slice(1);
        if (hash) return hash;
        const stored = localStorage.getItem('agent_token');
        if (stored) return stored;
        return 'YOUR_TOKEN_HERE';
    }

    function getFileIcon(fileType, filename) {
        const name = (filename || '').toLowerCase();
        if (name.endsWith('.pdf')) return '📕';
        if (/word|docx?/.test(fileType || '') || name.endsWith('.doc') || name.endsWith('.docx')) return '📘';
        if (/spreadsheet|xlsx?/.test(fileType || '') || name.endsWith('.xls') || name.endsWith('.xlsx')) return '📗';
        if (/presentation|pptx?/.test(fileType || '') || name.endsWith('.ppt') || name.endsWith('.pptx')) return '📙';
        if (/image/.test(fileType || '') || /\.(png|jpe?g|gif|svg|webp)$/.test(name)) return '🖼️';
        if (/text|markdown/.test(fileType || '') || /\.(txt|md)$/.test(name)) return '📄';
        return '📎';
    }

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const kb = bytes / 1024;
        if (kb < 1024) return kb.toFixed(1) + ' KB';
        return (kb / 1024).toFixed(1) + ' MB';
    }

    function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('hidden');
    }

    // ==================== 初始化 ====================
    // 生成演示用 Token（实际环境应通过登录接口获取）
    if (!localStorage.getItem('agent_token')) {
        console.warn('⚠ 请在 URL hash 中设置 Token：#your-sa-token，或调用登录接口获取');
    }
</script>
</body>
</html>
