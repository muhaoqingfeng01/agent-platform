# ============================================================
# Agent Platform — Main Configuration
# ============================================================
spring:
  application:
    name: agent-platform
  profiles:
    # local 对应 application-local.yml（敏感信息，已 gitignore，勿提交）
    active: ${SPRING_PROFILES_ACTIVE:dev,local}

  # 说明: 不使用 spring.config.import 拉 Nacos（会在 local 配置生效前鉴权失败）。
  # 动态配置由 NacosConfig 子类通过 NacosConfigManager 在容器启动后拉取（失败则 YAML 兜底）。
  cloud:
    nacos:
      # Nacos 3.x 默认开启鉴权；地址/账号请在 application-local.yml 或环境变量覆盖
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      # 空 = public 命名空间（Nacos 3.x 已合并空串与 public）
      namespace: ${NACOS_NAMESPACE:}
      config:
        # 保留 enabled=true 以创建 NacosConfigManager；不通过 spring.config.import 提前拉配置
        enabled: ${NACOS_CONFIG_ENABLED:true}
        # 关闭 SCA 对 spring.config.import=nacos: 的强制校验
        import-check:
          enabled: false
        file-extension: json
        group: DEFAULT_GROUP
        refresh-enabled: true
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
      discovery:
        # 当前以配置中心为主；服务发现默认关，需要时设 NACOS_DISCOVERY_ENABLED=true
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        register-enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8080}
        port: ${SENTINEL_PORT:8719}
      datasource:
        ds-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules.json
            data-type: json
            rule-type: flow
        ds-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
            namespace: ${NACOS_NAMESPACE:}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules.json
            data-type: json
            rule-type: degrade

  # --- Datasource (MySQL) ---
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/agent_platform_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000

  # --- Redis ---
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:null}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000ms

  # --- File Upload ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # --- Spring AI (DeepSeek Chat + OpenAI Embedding) ---
  ai:
    deepseek:
      # 启动期强制非空；真实密钥用 DEEPSEEK_API_KEY / application-local.yml 覆盖
      api-key: ${DEEPSEEK_API_KEY:sk-local-placeholder-change-me}
      chat:
        options:
          model: ${AI_MODEL:deepseek-v4-pro}
          temperature: 0.7
          max-tokens: 4096
    # OpenAI 仅用于 Embedding，禁用 ChatModel 避免与 DeepSeek 冲突
    openai:
      # 启动期强制非空；真实密钥用 EMBEDDING_API_KEY / application-local.yml 覆盖
      api-key: ${EMBEDDING_API_KEY:sk-local-placeholder-change-me}
      base-url: ${EMBEDDING_BASE_URL:https://api.deepseek.com}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-3-small}
        # TODO: 若使用 DashScope Embedding，修改 base-url 为 https://dashscope.aliyuncs.com/compatible-mode/v1
        # TODO: 若使用 OpenAI 原生 Embedding，修改 base-url 为 https://api.openai.com
      # ⚠️ 禁用 OpenAI ChatModel，仅保留 Embedding 功能
      chat:
        enabled: false

  # --- LDAP 企业认证（默认禁用） ---
  ldap:
    enabled: false
    urls: ldap://ldap.company.com:389
    base: dc=company,dc=com
    user-dn-pattern: uid={0},ou=users

# ============================================================
# Sa-Token (Authentication & Authorization)
# ============================================================
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600              # Access Token 有效期（秒），默认1小时
  active-timeout: 1800       # 临时有效期（秒），持续活跃则自动续期
  is-concurrent: true        # 是否允许同一账号并发登录
  is-share: true             # 共用一个Token（多端共享）
  token-style: random-64     # Token 风格：random-64（64位随机字符串）
  is-log: true               # 是否输出操作日志
  # ⚠️ alone-redis 仅在 prod 启用，dev 使用内存存储

# ============================================================
# MyBatis
# ============================================================
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.agent.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ============================================================
# Milvus (Vector Database)
# ============================================================
milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  username: ${MILVUS_USER:root}
  password: ${MILVUS_PASSWORD:}
  database: ${MILVUS_DATABASE:agent_platform}
  connect-timeout-ms: 10000
  keep-alive-time-ms: 60000
  # 本地可先不启 Milvus（对话仍可启动）；知识检索/文档向量化需要向量库
  required: ${MILVUS_REQUIRED:false}
  client-key-path: ""
  client-cert-path: ""
  server-cert-path: ""

# ============================================================
# MinIO (Object Storage for RAG Document Upload)
# ============================================================
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:knowledge-docs}
  # 预签名 URL 有效期（分钟）
  presigned-expiry-minutes: 10

# ============================================================
# Redisson (Distributed Lock & Cache)
# ============================================================
redisson:
  config: |
    {
      "singleServerConfig": {
        "address": "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}",
        "password": "${REDIS_PASSWORD:}",
        "database": ${REDIS_DATABASE:0},
        "connectionPoolSize": 16,
        "connectionMinimumIdleSize": 4,
        "timeout": 3000,
        "retryAttempts": 3,
        "retryInterval": 1500
      },
      "threads": 4,
      "nettyThreads": 8
    }

# ============================================================
# Server
# ============================================================
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  tomcat:
    max-connections: 1000
    threads:
      max: 200
      min-spare: 10
    connection-timeout: 30000

# ============================================================
# Actuator & Observability
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# ============================================================
# SpringDoc OpenAPI (Swagger)
# ============================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true
    filter: true
  show-actuator: true
  default-produces-media-type: application/json

# ============================================================
# Knife4j (增强版Swagger UI + 离线文档导出)
# ============================================================
knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-footer: false

# ============================================================
# Langfuse (LLM Observability)
# ============================================================
langfuse:
  host: ${LANGFUSE_HOST:http://localhost:3000}
  public-key: ${LANGFUSE_PUBLIC_KEY:}
  secret-key: ${LANGFUSE_SECRET_KEY:}
  enabled: ${LANGFUSE_ENABLED:false}

# ============================================================
# Logging（由 logback-spring.xml 统一管理）
# ============================================================
# 以下属性仅供 logback-spring.xml 通过 <springProperty> 读取，
# 各环境可通过 application-{profile}.yml 覆盖
logging:
  charset:
    console: UTF-8
    file: UTF-8

# ============================================================
# Security PII (Presidio 增强脱敏)
# ============================================================
security:
  pii:
    presidio:
      enabled: false               # 默认禁用，生产环境启用
      analyzer-url: http://localhost:3000
      timeout: 5000                # 超时 5 秒
      fallback-to-regex: true      # 超时时降级到正则

app:
  logging:
    base-path: ${LOG_BASE_PATH:D:/log}       # 日志根目录
    max-file-size: 300MB                      # 单个日志文件最大大小
    max-history-days: 30                      # 日志归档保留天数
    total-size-cap: 10GB                      # 日志归档总大小上限
  im:
    callback-token: ${IM_CALLBACK_TOKEN:dev-im-token}
